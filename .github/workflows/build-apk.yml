name: Gerar APK Release Farma Bolso

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  APP_VERSION: 2.0.0
  KEYSTORE_PASSWORD: FarmaBolsoCI2026

jobs:
  build-android-release:
    name: Compilar APK release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair projeto Expo
        run: |
          set -e
          mkdir -p build-project
          unzip -q "$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)" -d build-project
          PROJECT_DIR="$(find build-project -name package.json -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto em $PROJECT_DIR"

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --legacy-peer-deps --no-audit --fund=false

      - name: Corrigir dependência do Expo Router
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install query-string@^7 --save --legacy-peer-deps --no-audit --fund=false

      - name: Gerar projeto Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Preparar assinatura release
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p signing
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore signing/farma-bolso-release.keystore \
            -alias farma_bolso_release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Farma Bolso, OU=Release, O=Farma Bolso, C=BR"
          cat > android/farma-bolso-keystore.properties <<EOF
          storeFile=../signing/farma-bolso-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=farma_bolso_release
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = 'android {'
          signing = '''android {\n    signingConfigs {\n        release {\n            storeFile file("../signing/farma-bolso-release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias "farma_bolso_release"\n            keyPassword System.getenv("KEYSTORE_PASSWORD")\n        }\n    }'''
          if 'farma-bolso-release.keystore' not in s:
              s = s.replace(marker, signing, 1)
              s = s.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
              p.write_text(s)
          PY

      - name: Compilar APK release
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Separar APK final
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p apk-final
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "apk-final/Farma-Bolso-v${APP_VERSION}-release.apk"
          ls -lh apk-final

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Farma-Bolso-APK-v2.0.0
          path: ${{ env.PROJECT_DIR }}/apk-final/*.apk
          if-no-files-found: error
